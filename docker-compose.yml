# docker compose up --build
services:
    rabbitmq:
        image: rabbitmq:4-management
        container_name: rabbitmqA-compose-leam
        
        ports:
            - "5672:5672"
            - "15672:15672"
        
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin123
            
        healthcheck:
            test: ["CMD","rabbitmq-diagnostics","-q","ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            
        networks:
            - distribuidos-network
            
    libro:
        build:
            context: ./LibroA/LibroA.Api
            dockerfile: Dockerfile
            
        container_name: libroA-api-compose-leam
        
        ports:
            - "5001:8080"
            
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            # CORRECCIÓN 1, 2 y 3: Doble guion bajo, una sola línea y TrustServerCertificate
            ConnectionStrings__LibrosConnection: "Data Source=host.docker.internal,1433;Initial Catalog=LibroDB_A;User ID=usuario_libroA;Password=12345;Encrypt=False;TrustServerCertificate=True;"
                
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: "5672" # CORRECCIÓN 4: Entre comillas
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: libro_creado
            
        depends_on:
            rabbitmq:
                condition: service_healthy
                
        networks:
            - distribuidos-network
    
    inventario:
        build:
            context: ./InventarioA/InventarioA.Api
            dockerfile: Dockerfile
            
        container_name: inventarioA-api-compose-leam
        
        ports:
            - "5002:8080"
            
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            # CORRECCIÓN 1, 2 y 3: Doble guion bajo, una sola línea y TrustServerCertificate
            ConnectionStrings__InventarioConnection: "Data Source=host.docker.internal,1433;Initial Catalog=InventarioDB_A;User ID=usuario_inventarioA;Password=12345;Encrypt=False;TrustServerCertificate=True;"
                
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: "5672" # CORRECCIÓN 4: Entre comillas
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: libro_creado
            
        depends_on:
            rabbitmq:
                condition: service_healthy
                
        networks:
            - distribuidos-network
            
    categoria:
        build:
            context: ./CategoriaA/CategoriaA.Api
            dockerfile: Dockerfile
            
        container_name: categoriaA-api-compose-leam
        
        ports:
            - "5003:8080"
            
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            # CORRECCIÓN 1, 2 y 3: Doble guion bajo, una sola línea y TrustServerCertificate
            ConnectionStrings__CategoriasConnection: "Data Source=host.docker.internal,1433;Initial Catalog=CategoriaDB_A;User ID=usuario_categoriaA;Password=12345;Encrypt=False;TrustServerCertificate=True;"
                
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: "5672" # CORRECCIÓN 4: Entre comillas
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: categoria_creado
            
        depends_on:
            rabbitmq:
                condition: service_healthy
                
        networks:
            - distribuidos-network
            
    vehiculo:
        build:
            context: ./VehiculoA/VehiculoA.Api
            dockerfile: Dockerfile
            
        container_name: vehiculoA-api-compose-leam
        
        ports:
            - "5004:8080"
            
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            # CORRECCIÓN 1, 2 y 3: Doble guion bajo, una sola línea y TrustServerCertificate
            ConnectionStrings__VehiculosConnection: "Data Source=host.docker.internal,1433;Initial Catalog=VehiculoDB_A;User ID=usuario_vehiculoA;Password=12345;Encrypt=False;TrustServerCertificate=True;"
                
            RabbitMQ__HostName: rabbitmq
            RabbitMQ__Port: "5672" # CORRECCIÓN 4: Entre comillas
            RabbitMQ__UserName: admin
            RabbitMQ__Password: admin123
            RabbitMQ__QueueName: categoria_creado
            
        depends_on:
            rabbitmq:
                condition: service_healthy
                
        networks:
            - distribuidos-network
    
    apigateway:
        build:
            context: ./ApiGetewayA
            dockerfile: ApiGetewayA/Dockerfile
            
        container_name: apigatewayA-api-compose-leam
        
        ports:
            - "5080:8080"
            
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: "http://+:8080"
            
            # CORRECCIÓN 1 y 2: Doble guion bajo estricto y en una sola línea
            ReverseProxy__Clusters__librosCluster__Destinations__librosDestination__Address: "http://libro:8080/"
            ReverseProxy__Clusters__inventariosCluster__Destinations__inventariosDestination__Address: "http://inventario:8080/"
            ReverseProxy__Clusters__categoriasCluster__Destinations__categoriasDestination__Address: "http://categoria:8080/"
            ReverseProxy__Clusters__vehiculosCluster__Destinations__vehiculosDestination__Address: "http://vehiculo:8080/"
            
        depends_on:
            - libro
            - inventario
            - categoria
            - vehiculo
            
        networks:
            - distribuidos-network
            
networks:
    distribuidos-network:
        driver: bridge